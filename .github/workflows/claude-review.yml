name: claude-review

on:
  pull_request:
    types: [opened, ready_for_review]
    paths:
      - "src/**"
      - "tests/**"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Review this pull request following CLAUDE.md. Read the changes with `gh pr diff`.
            Post specific issues as inline comments using the inline comment tool.
            Always finish by posting a summary with
            `gh pr comment ${{ github.event.pull_request.number }} --body "<your summary>"`,
            even if you found nothing important. Your final message is not visible to anyone.
          claude_args: '--model sonnet --max-turns 8 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'